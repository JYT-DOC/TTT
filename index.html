<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>甲鱼汤的笔记本</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #1c1c1a;
    --muted: #8a8a85;
    --line: #e6e5e0;
    --accent: #2f6f4f;
    --danger: #b3453c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 40px 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }

  .editor {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 28px;
  }
  .editor input, .editor textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
  }
  .editor input {
    font-weight: 600;
    padding: 4px 0 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .editor textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .editor .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .hint { color: var(--muted); font-size: 12px; }
  .editor button {
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .editor button:hover { opacity: .92; }

  .search {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 18px;
  }
  .search:focus { border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .note {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .note h3 { margin: 0; font-size: 15px; font-weight: 600; word-break: break-word; }
  .note p {
    margin: 0;
    color: #4a4a46;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
  }
  .note footer { display: flex; justify-content: space-between; align-items: center; }
  .note time { color: var(--muted); font-size: 12px; }
  .note .del {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .note .del:hover { color: var(--danger); background: #faf0ee; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 32px 0; grid-column: 1 / -1; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>甲鱼汤的笔记本</h1>
    </header>

    <section class="editor">
      <input id="noteTitle" type="text" placeholder="标题" maxlength="100">
      <textarea id="noteBody" placeholder="写点什么…" maxlength="5000"></textarea>
      <div class="actions">
        <span class="hint">Ctrl + Enter 快速保存</span>
        <button id="saveBtn" type="button">保存笔记</button>
      </div>
    </section>

    <input class="search" id="search" type="search" placeholder="搜索笔记…" autocomplete="off">
    <div class="grid" id="grid"></div>
  </div>

<script>
  const KEY = 'log-notes-items';
  const titleEl = document.getElementById('noteTitle');
  const bodyEl = document.getElementById('noteBody');
  const saveBtn = document.getElementById('saveBtn');
  const searchEl = document.getElementById('search');
  const grid = document.getElementById('grid');

  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  let notes = [];
  try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { notes = []; }

  function save() { localStorage.setItem(KEY, JSON.stringify(notes)); }

  function fmt(ts) {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const visible = q
      ? notes.filter(n => (n.title + ' ' + n.body).toLowerCase().includes(q))
      : notes;

    if (!visible.length) {
      grid.innerHTML = `<div class="empty">${q ? '没有匹配的笔记' : '还没有写过笔记哦'}</div>`;
      return;
    }

    grid.innerHTML = visible.map(n => `
      <article class="note" data-id="${esc(n.id)}">
        <h3>${esc(n.title || '无标题')}</h3>
        <p>${esc(n.body)}</p>
        <footer>
          <time>${fmt(n.time)}</time>
          <button class="del" type="button" title="删除">×</button>
        </footer>
      </article>`).join('');
  }

  function addNote() {
    const title = titleEl.value.trim();
    const body = bodyEl.value.trim();
    if (!title && !body) { bodyEl.focus(); return; }
    notes.unshift({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      title,
      body,
      time: Date.now()
    });
    save();
    titleEl.value = '';
    bodyEl.value = '';
    render();
    titleEl.focus();
  }

  saveBtn.addEventListener('click', addNote);
  bodyEl.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') addNote();
  });
  searchEl.addEventListener('input', render);

  grid.addEventListener('click', e => {
    if (!e.target.classList.contains('del')) return;
    const card = e.target.closest('article[data-id]');
    if (!confirm('要删除这条笔记吗？')) return;
    notes = notes.filter(n => n.id !== card.dataset.id);
    save();
    render();
  });

  render();
</script>
</body>
</html>
