<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>甲鱼汤的记账本</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #1c1c1a;
    --muted: #8a8a85;
    --line: #e6e5e0;
    --accent: #2f6f4f;
    --income: #2f6f4f;
    --expense: #b3453c;
    --soft: #f2f1ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 40px 20px 64px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }

  /* 概览 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stat .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .stat .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.exp .value { color: var(--expense); }
  .stat.inc .value { color: var(--income); }

  /* 表单 */
  .seg { display: inline-flex; background: var(--soft); border-radius: 9px; padding: 3px; margin-bottom: 14px; }
  .seg button {
    border: none; background: none; cursor: pointer; font: inherit; font-size: 14px;
    color: var(--muted); padding: 6px 18px; border-radius: 7px;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.06); font-weight: 600; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field.amount input { font-weight: 600; }
  .field.span { grid-column: 1 / -1; }

  .form-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .hint { color: var(--muted); font-size: 12px; }
  .btn {
    border: none; border-radius: 8px; background: var(--accent); color: #fff;
    font: inherit; font-size: 14px; padding: 9px 20px; cursor: pointer;
  }
  .btn:hover { opacity: .92; }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); margin-right: 8px; }
  .btn.ghost:hover { color: var(--text); background: var(--soft); opacity: 1; }

  /* 时间定位 */
  .timebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 20px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dates { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .dates input {
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit;
    font-size: 12px; color: var(--text); background: var(--card); outline: none;
  }
  .dates input:focus { border-color: var(--accent); }
  .dates span { color: var(--muted); font-size: 12px; }
  .search {
    width: 100%; padding: 9px 13px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--text); font: inherit; font-size: 13px; outline: none;
  }
  .search:focus { border-color: var(--accent); }

  /* 构成 */
  .breakdown h2, .list h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--muted); }
  .bar-row { display: grid; grid-template-columns: 60px 1fr 82px; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-row .name { font-size: 13px; }
  .bar { height: 6px; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--expense); border-radius: 4px; }
  .bar-row .num { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  /* 明细 */
  .day { margin-bottom: 18px; }
  .day-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); padding: 0 2px 6px; border-bottom: 1px solid var(--line); margin-bottom: 2px;
  }
  .day-head button {
    border: none; background: none; font: inherit; font-size: 12px; color: var(--muted);
    cursor: pointer; padding: 0; text-decoration: none; border-bottom: 1px dashed transparent;
  }
  .day-head button:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .day-head .date { font-weight: 600; color: var(--text); }
  .row { display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--soft); }
  .row:last-child { border-bottom: none; }
  .row .hhmm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .row .main { min-width: 0; }
  .row .cat { font-size: 14px; font-weight: 500; }
  .row .note { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .money { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .money.exp { color: var(--expense); }
  .row .money.inc { color: var(--income); }
  .row .ops { display: flex; gap: 2px; opacity: 0; }
  .row:hover .ops { opacity: 1; }
  .ops button { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 3px 6px; border-radius: 6px; }
  .ops button:hover { background: var(--soft); color: var(--text); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 0; }
  .offline { background: #fdf6ec; border-color: #f0dfc0; color: #7a5a20; font-size: 13px; line-height: 1.7; }
  .offline code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  @media (max-width: 620px) {
    body { padding: 24px 14px 48px; }
    .fields { grid-template-columns: 1fr; }
    .dates { margin-left: 0; width: 100%; }
    .stats { grid-template-columns: 1fr 1fr 1fr; }
    .stat .value { font-size: 16px; }
    .row .ops { opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>甲鱼汤的记账本</h1>
    <span class="sub" id="today"></span>
  </header>
  <div class="card offline" id="offline" hidden>
    手机浏览器禁用了本地存储（可能处于隐私/无痕模式），记录无法保存。<br>
    请退出隐私模式后重新打开本页面。
  </div>

  <section class="card">
    <div class="stats">
      <div class="stat exp"><div class="label">支出</div><div class="value" id="statExpense">¥0.00</div></div>
      <div class="stat inc"><div class="label">收入</div><div class="value" id="statIncome">¥0.00</div></div>
      <div class="stat"><div class="label">结余</div><div class="value" id="statNet">¥0.00</div></div>
    </div>
  </section>

  <section class="card">
    <div class="seg" id="seg">
      <button type="button" data-type="expense" class="on">支出</button>
      <button type="button" data-type="income">收入</button>
    </div>
    <div class="fields">
      <div class="field amount">
        <label for="amount">金额</label>
        <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="field">
        <label for="category">分类</label>
        <input id="category" list="catList" placeholder="餐饮" autocomplete="off">
        <datalist id="catList"></datalist>
      </div>
      <div class="field span">
        <label for="when">时间</label>
        <input id="when" type="datetime-local">
      </div>
      <div class="field span">
        <label for="note">备注</label>
        <input id="note" type="text" placeholder="可选，例如：便利店" maxlength="200" autocomplete="off">
      </div>
    </div>
    <div class="form-actions">
      <span class="hint" id="formHint">Ctrl + Enter 快速记账</span>
      <span>
        <button class="btn ghost" type="button" id="cancelBtn" hidden>取消编辑</button>
        <button class="btn" type="button" id="saveBtn">记一笔</button>
      </span>
    </div>
  </section>

  <section class="card">
    <div class="timebar">
      <div class="chips" id="chips">
        <button class="chip" data-preset="today" type="button">今天</button>
        <button class="chip" data-preset="week" type="button">近 7 天</button>
        <button class="chip" data-preset="month" type="button">本月</button>
        <button class="chip" data-preset="lastMonth" type="button">上月</button>
        <button class="chip" data-preset="all" type="button">全部</button>
      </div>
      <div class="dates">
        <input id="startDate" type="date" aria-label="开始日期"><span>至</span>
        <input id="endDate" type="date" aria-label="结束日期">
      </div>
    </div>
    <input class="search" id="search" type="search" placeholder="搜索分类或备注…" autocomplete="off">
  </section>

  <section class="card breakdown" id="breakdownCard" hidden>
    <h2>支出构成</h2>
    <div id="breakdown"></div>
  </section>

  <section class="card list">
    <h2 id="rangeLabel">明细</h2>
    <div id="list"></div>
  </section>
</div>

<script>
  const STORE_KEY = 'ledger.records.v1';
  const CATS = {
    expense: ['餐饮', '交通', '购物', '居住', '娱乐', '医疗', '教育', '其他'],
    income: ['工资', '奖金', '理财', '报销', '其他']
  };
  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  const el = id => document.getElementById(id);
  const amountEl = el('amount'), catEl = el('category'), whenEl = el('when'), noteEl = el('note');
  const startEl = el('startDate'), endEl = el('endDate'), searchEl = el('search');

  let records = [];
  let type = 'expense';
  let editingId = null;

  // ---------- 时间工具 ----------
  const pad = n => String(n).padStart(2, '0');
  function dayOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function localInput(d) { return `${dayOf(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function money(n) {
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function prettyDay(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return `${m}月${d}日 ${WEEK[date.getDay()]}`;
  }

  // ---------- 数据（手机浏览器本地存储） ----------
  function storageOk() {
    try {
      localStorage.setItem(STORE_KEY + '.test', '1');
      localStorage.removeItem(STORE_KEY + '.test');
      return true;
    } catch (e) {
      return false;
    }
  }

  function load() {
    if (!storageOk()) {
      records = [];
      el('offline').hidden = false;
      render();
      return;
    }
    try {
      records = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
      if (!Array.isArray(records)) records = [];
    } catch (e) {
      records = [];
    }
    el('offline').hidden = true;
    render();
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(records));
      return true;
    } catch (e) {
      alert('保存失败：手机浏览器存储空间不足或已被禁用');
      return false;
    }
  }

  function makeId() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function create(data) {
    const saved = { id: makeId(), ...data };
    records.unshift(saved);
    if (!persist()) { records.shift(); return null; }
    return saved;
  }

  function update(id, data) {
    const index = records.findIndex(r => r.id === id);
    if (index < 0) return null;
    const old = records[index];
    records[index] = { id, ...data };
    if (!persist()) { records[index] = old; return null; }
    return records[index];
  }

  function remove(id) {
    const index = records.findIndex(r => r.id === id);
    if (index < 0) return true;
    const [gone] = records.splice(index, 1);
    if (!persist()) { records.splice(index, 0, gone); return false; }
    return true;
  }

  // ---------- 表单 ----------
  function setType(next) {
    type = next;
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.type === type));
    fillCats();
    if (!editingId) catEl.value = '';
  }
  function fillCats() {
    el('catList').innerHTML = CATS[type].map(c => `<option value="${c}">`).join('');
  }
  function resetForm() {
    editingId = null;
    amountEl.value = ''; catEl.value = ''; noteEl.value = '';
    whenEl.value = localInput(new Date());
    el('saveBtn').textContent = '记一笔';
    el('cancelBtn').hidden = true;
    el('formHint').textContent = 'Ctrl + Enter 快速记账';
  }
  async function submitForm() {
    const value = parseFloat(amountEl.value);
    if (!(value > 0)) { amountEl.focus(); return; }
    if (!whenEl.value) { whenEl.focus(); return; }
    const payload = {
      type,
      amount: Math.round(value * 100) / 100,
      category: catEl.value.trim() || (type === 'expense' ? '其他' : '收入'),
      note: noteEl.value.trim(),
      time: whenEl.value.length === 16 ? whenEl.value : whenEl.value.slice(0, 16)
    };
    const saved = editingId ? update(editingId, payload) : create(payload);
    if (!saved) return;
    resetForm();
    render();
    amountEl.focus();
  }
  function edit(record) {
    editingId = record.id;
    setType(record.type);
    amountEl.value = record.amount;
    catEl.value = record.category;
    noteEl.value = record.note || '';
    whenEl.value = record.time;
    el('saveBtn').textContent = '更新记录';
    el('cancelBtn').hidden = false;
    el('formHint').textContent = `正在编辑 ${record.time.replace('T', ' ')} 的记录`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- 时间定位 ----------
  function applyPreset(name) {
    const now = new Date();
    if (name === 'today') {
      setRange(dayOf(now), dayOf(now));
    } else if (name === 'week') {
      const from = new Date(now); from.setDate(now.getDate() - 6);
      setRange(dayOf(from), dayOf(now));
    } else if (name === 'month') {
      setRange(dayOf(new Date(now.getFullYear(), now.getMonth(), 1)), dayOf(now));
    } else if (name === 'lastMonth') {
      setRange(dayOf(new Date(now.getFullYear(), now.getMonth() - 1, 1)),
               dayOf(new Date(now.getFullYear(), now.getMonth(), 0)));
    } else {
      startEl.value = ''; endEl.value = '';
    }
    markPreset(name);
    render();
  }
  function setRange(start, end) { startEl.value = start; endEl.value = end; }
  function markPreset(name) {
    document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.preset === name));
  }
  function currentRange() {
    return { start: startEl.value, end: endEl.value };
  }
  function locateDay(iso) {
    setRange(iso, iso);
    markPreset('');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function inRange(recTime, { start, end }) {
    const day = recTime.slice(0, 10);
    if (start && day < start) return false;
    if (end && day > end) return false;
    return true;
  }

  // ---------- 渲染 ----------
  function visibleRecords() {
    const q = searchEl.value.trim().toLowerCase();
    const range = currentRange();
    return records
      .filter(r => inRange(r.time, range))
      .filter(r => !q || (r.category + ' ' + (r.note || '')).toLowerCase().includes(q))
      .sort((a, b) => b.time.localeCompare(a.time));
  }

  function render() {
    const list = visibleRecords();
    const expense = list.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
    const income = list.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
    el('statExpense').textContent = money(expense);
    el('statIncome').textContent = money(income);
    el('statNet').textContent = money(income - expense);

    const { start, end } = currentRange();
    el('rangeLabel').textContent = `明细 · 共 ${list.length} 笔` +
      (start || end ? ` · ${start || '最早'} 至 ${end || '今天'}` : '');

    renderBreakdown(list);
    renderList(list);
  }

  function renderBreakdown(list) {
    const totals = new Map();
    let sum = 0;
    list.filter(r => r.type === 'expense').forEach(r => {
      sum += r.amount;
      totals.set(r.category, (totals.get(r.category) || 0) + r.amount);
    });
    const card = el('breakdownCard');
    if (!totals.size) { card.hidden = true; return; }
    card.hidden = false;
    el('breakdown').innerHTML = [...totals.entries()]
      .sort((a, b) => b[1] - a[1])
      .slice(0, 6)
      .map(([name, value]) => `
        <div class="bar-row">
          <span class="name">${esc(name)}</span>
          <span class="bar"><i style="width:${(value / sum * 100).toFixed(1)}%"></i></span>
          <span class="num">${money(value)} · ${(value / sum * 100).toFixed(0)}%</span>
        </div>`).join('');
  }

  function renderList(list) {
    const box = el('list');
    if (!list.length) {
      box.innerHTML = `<div class="empty">${records.length ? '该时间段没有记录，换个日期试试' : '还没有账目'}</div>`;
      return;
    }
    const days = new Map();
    list.forEach(r => {
      const day = r.time.slice(0, 10);
      if (!days.has(day)) days.set(day, []);
      days.get(day).push(r);
    });
    box.innerHTML = [...days.entries()].map(([day, items]) => {
      const out = items.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
      return `
        <div class="day">
          <div class="day-head">
            <button type="button" class="date" data-day="${day}" title="只看这一天">${prettyDay(day)} ›</button>
            <span>支出 ${money(out)}</span>
          </div>
          ${items.map(row).join('')}
        </div>`;
    }).join('');
  }

  function row(r) {
    const isExp = r.type === 'expense';
    return `
      <div class="row" data-id="${esc(r.id)}">
        <span class="hhmm">${r.time.slice(11)}</span>
        <span class="main">
          <span class="cat">${esc(r.category)}</span>
          ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
        </span>
        <span class="money ${isExp ? 'exp' : 'inc'}">${isExp ? '-' : '+'}${money(r.amount)}</span>
        <span class="ops">
          <button type="button" data-act="edit" title="编辑">✎</button>
          <button type="button" data-act="del" title="删除">×</button>
        </span>
      </div>`;
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  // ---------- 事件 ----------
  el('seg').addEventListener('click', e => {
    const btn = e.target.closest('button[data-type]');
    if (btn) setType(btn.dataset.type);
  });
  el('saveBtn').addEventListener('click', submitForm);
  el('cancelBtn').addEventListener('click', resetForm);
  el('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) applyPreset(chip.dataset.preset);
  });
  [startEl, endEl].forEach(input => input.addEventListener('change', () => { markPreset(''); render(); }));
  searchEl.addEventListener('input', render);
  whenEl.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') submitForm(); });
  noteEl.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') submitForm(); });

  el('list').addEventListener('click', e => {
    const dayBtn = e.target.closest('button[data-day]');
    if (dayBtn) { locateDay(dayBtn.dataset.day); return; }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const rec = records.find(r => r.id === btn.closest('.row').dataset.id);
    if (!rec) return;
    if (btn.dataset.act === 'edit') { edit(rec); return; }
    if (!confirm(`删除 ${rec.time.replace('T', ' ')} 的「${rec.category}」${money(rec.amount)}？`)) return;
    if (!remove(rec.id)) return;
    if (editingId === rec.id) resetForm();
    render();
  });

  // ---------- 初始化 ----------
  const now = new Date();
  el('today').textContent = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日`;
  fillCats();
  resetForm();
  applyPreset('month');
  load();
</script>
</body>
</html>
